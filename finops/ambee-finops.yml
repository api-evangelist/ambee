specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Ambee
providerId: ambee
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- Environmental Intelligence
- Air Quality
- Weather
- Pollen
- Geospatial
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Ambee API spend. Ambee bills on a contract / subscription
  basis negotiated per Enterprise agreement, with an Evaluation trial for
  pre-purchase testing. Cost is driven primarily by request volume across
  products (air quality, pollen, weather, fire, soil, NDVI), historical-data
  depth, and any bulk dataset or webhook delivery. Exact rates are quoted by
  Ambee sales and are not reconciled here.
notes: >-
  Ambee does not publish per-call list prices; FOCUS mapping below is
  structural. Verify ServiceName, charge categories, and metered dimensions
  against an actual Ambee invoice during reconciliation.
sources:
- https://www.getambee.com/pricing
- https://docs.ambeedata.com/apis/overview
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Ambee
serviceCategory: Analytics and Data
billingModel:
  pricingCategory: Commitment-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Ambee API
  ServiceCategory: Analytics and Data
  ProviderName: Ambee
  PublisherName: Ambee
  InvoiceIssuerName: Ambee
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Commitment-Based
meters:
- name: api_requests
  description: API requests made against Ambee product endpoints, counted per key per product.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - product
  - endpoint
- name: historical_requests
  description: Historical (time-range) lookups, which may carry higher cost than latest lookups.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - product
- name: bulk_data_volume
  description: Bulk dataset exports or data dumps delivered under enterprise agreements.
  unit: records
  aggregation: sum
  dimensions:
  - account
  - product
principles:
- name: Visibility
  description: Track per-key, per-product request volume against the contracted quota.
- name: Allocation
  description: Issue separate API keys per workload/product and map to internal cost centers.
- name: Optimization
  description: Cache latest readings, batch lat/lng lookups by region, and avoid unnecessary historical queries.
- name: Accountability
  description: Assign an owner per key; review request burn monthly against the enterprise commitment.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
