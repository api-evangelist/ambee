specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Ambee
providerId: ambee
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- Environmental Intelligence
- Air Quality
- Weather
- Pollen
- Geospatial
- Rate Limiting
- Quotas
- Throttling
description: >-
  Ambee enforces per-account request quotas tied to the API key issued for an
  Evaluation (trial) or Enterprise plan. Quotas vary by plan and by product
  and are not published as fixed numbers; requests beyond the allotted quota
  or with an invalid key are rejected. Specific per-plan request-per-day and
  request-per-minute values are not reconciled in this artifact.
notes: >-
  Confirm exact quotas with Ambee at reconciliation; trial limits are set at
  signup and enterprise limits are negotiated. Invalid or missing keys return
  HTTP 401 (Invalid Authentication Key).
sources:
- https://docs.ambeedata.com/apis/overview
- https://www.getambee.com/pricing
responseCodes:
  unauthorized: 401
  throttled: 429
limits:
- name: Requests Per Day (RPD)
  scope: account
  metric: requests
  limit: see provider documentation
  notes: Per-API-key daily quota, varies by plan and product.
- name: Requests Per Minute (RPM)
  scope: account
  metric: requests
  limit: see provider documentation
  notes: Per-API-key burst limit, varies by plan.
- name: Per-Product Quota
  scope: account
  metric: requests
  limit: see provider documentation
  notes: Air Quality, Pollen, Weather, Fire, Soil, and NDVI may each carry distinct quotas.
policies:
- name: API Key Authentication
  description: All requests must include a valid x-api-key header; invalid or missing keys return HTTP 401.
- name: Tiered Quotas
  description: Quotas raise from Evaluation (trial) to negotiated Enterprise agreements.
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor Retry-After on throttling.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
