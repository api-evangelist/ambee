description: Ambee is an environmental-intelligence company that aggregates satellite,
  sensor, and ground-station data into a unified REST API. The Ambee API delivers
  hyperlocal air quality, pollen, weather, wildfire, soil, and NDVI/vegetation data
  worldwide via simple lat/lng, postal-code, and place lookups secured with an
  x-api-key header.
