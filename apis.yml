aid: ambee
url: https://raw.githubusercontent.com/api-evangelist/ambee/refs/heads/main/apis.yml
name: Ambee
kind: company
description: Ambee is an environmental-intelligence company that aggregates satellite,
  sensor, and ground-station data into a unified REST API. The Ambee API delivers
  hyperlocal air quality, pollen, weather, wildfire, soil, and NDVI/vegetation data
  worldwide via simple lat/lng, postal-code, and place lookups secured with an
  x-api-key header.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Environmental Intelligence
- Air Quality
- Weather
- Pollen
- Geospatial
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
